# engine/llm_providers.yaml
#
# 各 LLM provider 的 API + CLI 双轨配置，由 engine/llm.py 加载。
# Key（如 `claude-sonnet-4-6`）= 角色 frontmatter 中的 `model:` 字段值。
#
# Schema：
#   mode:    dual_track / api_only / cli_only
#   prefer:  auto / api / cli  （仅 dual_track 有效；auto = api 优先，回退 cli）
#   tokenizer: cl100k_base / o200k_base / chars
#              由 engine/token_counter.py 使用，决定 tiktoken 分词器。
#              cl100k_base  — Claude / DeepSeek / LLaMA 等
#              o200k_base   — GPT-4o / GPT-4o-mini
#              chars        — 无公开分词器，用 chars // 2.5 估算（Gemini 等）
#   context_window: 模型上下文窗口 token 数（input+output 上限）。
#              由 engine/llm.py 的 _audit_token_budget 使用，做入口总量审计：
#              ≥ 80% 打 WARNING，≥ 95% raise RuntimeError 提前阻断。
#              未声明时默认 200000（保守值）。
#   api:
#     kind:     anthropic / openai_compat
#     key_env:  存放 API key 的环境变量名
#     model:    传给 API 的实际 model id
#     base_url: 可选；OpenAI 兼容 SDK 用此重定向到 DeepSeek/Ollama 等
#   cli:
#     path:                          CLI 可执行文件名（PATH 中查找）
#     model:                         传给 CLI 的 --model 参数值
#     output_format:                 stream-json / plain
#     extra_args:                    其他必传 flag
#     use_system_prompt_flag:        true → 用 --system-prompt 替换默认；
#                                    false → 把 system prompt inline 进 user input
#                                    （inline 易被识别为 prompt injection，避免）

# ── Claude（默认）─────────────────────────────────────────
# Fable 5 / Sonnet 5 说明（2026-07 查证）：
#   - 两者 context window 均为 1M（默认即最大），max output 128K。
#   - 均使用 Opus 4.7 引入的新 tokenizer（同文本比旧 tokenizer 多 ~30% token）；
#     tiktoken 不支持，沿用 cl100k_base 近似（估算偏低，审计阈值留有余量）。
#   - Fable 5 定价 $10/$50 per MTok（高于 Opus 档）；API 直连需组织开启 30 天数据保留。
claude-fable-5:
  mode: dual_track
  prefer: auto
  tokenizer: cl100k_base
  context_window: 1000000
  api:
    kind: anthropic
    key_env: ANTHROPIC_API_KEY
    model: claude-fable-5
  cli:
    path: claude
    model: claude-fable-5
    output_format: stream-json
    extra_args: ["--print", "--verbose", "--output-format", "stream-json", "--disallowed-tools", "Bash,Read,Write,Edit,NotebookEdit,Glob,Grep,WebFetch,WebSearch,TodoWrite,TaskCreate,TaskUpdate"]
    use_system_prompt_flag: true

