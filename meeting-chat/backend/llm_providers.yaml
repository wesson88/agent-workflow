# ============================================================
# LLM Provider 配置文件
# 所有模型切换在此文件完成，代码无需修改
#
# ── 接入模式 (mode) ──────────────────────────────────────────
#
#   openai_compat   纯 API Key 模式，使用 OpenAI 兼容 HTTP 接口
#                   适用：DeepSeek / Gemini / Codex / Qwen / 任何兼容 OpenAI 的服务
#
#   dual_track      双轨模式（通用）：API Key 与 CLI 互为备用
#                   prefer 字段控制优先级：
#                     auto  → 有 API Key 用 API，有 CLI 用 CLI，均无报错
#                     api   → 强制 API（无 Key 则报错）
#                     cli   → 优先 CLI，CLI 不可用时降级 API
#                   适用：Claude / Gemini CLI / 任何同时提供 API 和 CLI 的模型
#
#   cli_only        纯 CLI 模式，只走本地进程，不需要 API Key
#                   适用：Ollama 本地模型、完全离线场景
#
# ── CLI 输出格式 (cli_output_format) ─────────────────────────
#   stream_json     逐行 JSON 流（Claude Code CLI 格式）
#   plain           纯文本输出（Gemini CLI / Ollama / 大多数 CLI 工具）
#
# ── 旧 mode 别名（向下兼容，不建议新配置使用）────────────────
#   claude_auto  = dual_track + prefer: auto
#   claude_cli   = dual_track + prefer: cli
#   anthropic_api = openai_compat（走 Anthropic API）
#
# ── 环境变量引用：使用 ${ENV_VAR_NAME} 语法 ──────────────────
# ============================================================

providers:

  # ── DeepSeek ──────────────────────────────────────────────
  deepseek:
    mode: openai_compat
    api_key: ${DEEPSEEK_API_KEY}
    base_url: ${DEEPSEEK_BASE_URL}
    model: ${DEEPSEEK_MODEL}
    timeout: 60
    max_tokens: 2000
    temperature: 0.7

  # ── Claude 双轨（API Key 优先，CLI 兜底）──────────────────
  claude:
    mode: dual_track         # 通用双轨模式
    prefer: auto             # auto | api | cli
    # API Key 轨道
    api_key: ${CLAUDE_API_KEY}
    base_url: ${CLAUDE_BASE_URL}
    model: ${CLAUDE_MODEL}
    # CLI 轨道
    cli_path: ${CLAUDE_CLI_PATH}
    cli_model: ${CLAUDE_CLI_MODEL}
    cli_output_format: stream_json   # Claude Code CLI 输出 JSON 流
    timeout: 120
    max_tokens: 4000
    temperature: 0.7

  # ── OpenAI Codex ──────────────────────────────────────────
  codex:
    mode: openai_compat
    api_key: ${OPENAI_API_KEY}
    base_url: ${OPENAI_BASE_URL}
    model: ${CODEX_MODEL}
    timeout: 60
    max_tokens: 3000
    temperature: 0.2

  # ── Gemini（API Key 方式，兼容 OpenAI 接口）──────────────
  gemini:
    mode: openai_compat
    api_key: ${GEMINI_API_KEY}
    base_url: ${GEMINI_BASE_URL}
    model: ${GEMINI_MODEL}
    timeout: 90
    max_tokens: 8000
    temperature: 0.8

  # ── 扩展示例（按需取消注释）──────────────────────────────

  # Gemini 双轨示例：同时支持 API Key 和 Gemini CLI
  # gemini:
  #   mode: dual_track
  #   prefer: auto
  #   api_key: ${GEMINI_API_KEY}
  #   base_url: ${GEMINI_BASE_URL}
  #   model: ${GEMINI_MODEL}
  #   cli_path: gemini               # npm install -g @google/gemini-cli
  #   cli_model: gemini-2.5-pro
  #   cli_output_format: plain       # Gemini CLI 输出纯文本
  #   timeout: 90
  #   max_tokens: 8000
  #   temperature: 0.8

