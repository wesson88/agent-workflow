[pytest]
# 仓根加入 sys.path。当前无仓根代码依赖它（src/ 已于 2026-08-16 清理），
# 保留是因为 .claude/tests 里的用例以 `engine.*` / `common` 形式 import，
# 由 .claude/tests/engine/conftest.py 注入路径；此项作为兜底不影响任何东西。
pythonpath = .

# testpaths = 默认测试范围（不带路径参数跑 pytest 时收集哪些目录）
#
# .claude/tests/ — 引擎本体自测（随引擎一起进 git），当前唯一的测试来源
#
# 2026-08-16 收窄：原值是 `tests .claude/tests`。`tests/` 那一项是
# PROJECT_CODE_ROOT 之前那个时代的遗留 —— 当时约定「项目产出的代码测试放仓根
# tests/，每个项目一份」。该约定已被 PROJECT_CODE_ROOT 取代（`.env` 配
# `D:/workstation/ai/tools/{project}`，真实项目各自带 tests/），见
# memory「项目代码不放 agent-workflow/src/」。
#
# 配置 stale 的后果：仓根残留的 visitor-counter demo（src/ + tests/ + conftest.py，
# 均 gitignored）里有 6 条断言长期失败（读仓根 static/index.html，而文件早已移到
# src/backend/static/），把「提交前跑测试」这道手动闸堵死 —— 而引擎套件本身一直全绿。
#
# 同日已把那套 demo 残留整体删除，所以本项现在只是「唯一正确的范围」而非「收窄」。
# 新项目的测试跟随其代码放在 PROJECT_CODE_ROOT 下，在各自目录里跑，不回流本仓。
testpaths = .claude/tests
