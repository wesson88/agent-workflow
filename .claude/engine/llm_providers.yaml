# ── DeepSeek（OpenAI 兼容）────────────────────────────────
# 启用前需在 .env 中设置 DEEPSEEK_API_KEY=sk-...
# 官方文档（2026-05 查证）：context_window=1M，max output=384K，默认开 thinking mode。
# deepseek-chat / deepseek-reasoner 将在 2026-07-24 弃用，统一收敛到 v4 系列。
deepseek-v4-pro:
  mode: api_only
  tokenizer: cl100k_base
  context_window: 1000000
  api:
    kind: openai_compat
    key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    model: deepseek-v4-pro

deepseek-v4-flash:
  mode: api_only
  tokenizer: cl100k_base
  context_window: 1000000
  api:
    kind: openai_compat
    key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    model: deepseek-v4-flash

# ── OpenAI ────────────────────────────────────────────────
# 启用前需在 .env 中设置 OPENAI_API_KEY=sk-...
gpt-4o:
  mode: api_only
  tokenizer: o200k_base
  context_window: 128000
  api:
    kind: openai_compat
    key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    model: gpt-4o

gpt-4o-mini:
  mode: api_only
  tokenizer: o200k_base
  context_window: 128000
  api:
    kind: openai_compat
    key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini

# ── Gemini ────────────────────────────────────────────────
# Gemini 使用 SentencePiece 分词器，tiktoken 不支持。
# tokenizer: chars → 由 token_counter.py 用 chars // 2.5 估算。
# API 路由：Gemini 官方提供 OpenAI 兼容端点。
# CLI 路由：Google Gemini CLI（gemini），无 --system-prompt flag。
#
# 双 key 分流（2026-06 起）：
#   GEMINI_API_KEY_FREE  → flash 系列（量大、便宜，跑免费配额）
#   GEMINI_API_KEY_PAID  → pro 系列（贵且关键，付费避免被免费 rate limit 卡）
#   key 在 .env 里设置；任一为空时对应模型在入口审计阶段报错。
#
# 精度说明：chars 估算对 Gemini 误差约 ±20%（英文偏低，中文偏高）。
# 如需精确计数，安装 google-generativeai 并调用 model.count_tokens()。

# Flash 系列 → 免费 key
gemini-3.5-flash:
  mode: api_only
  tokenizer: chars
  context_window: 1000000
  api:
    kind: openai_compat
    key_env: GEMINI_API_KEY_FREE
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-3.5-flash

gemini-2.5-flash:
  mode: dual_track
  prefer: auto
  tokenizer: chars
  context_window: 1000000
  api:
    kind: openai_compat
    key_env: GEMINI_API_KEY_FREE
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-2.5-flash
  cli:
    path: gemini
    model: gemini-2.5-flash
    output_format: plain
    extra_args: []
    use_system_prompt_flag: false

# Pro 系列 → 收费 key
gemini-2.5-pro:
  mode: dual_track
  prefer: auto
  tokenizer: chars
  context_window: 1000000
  api:
    kind: openai_compat
    key_env: GEMINI_API_KEY_PAID
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-2.5-pro
  cli:
    path: gemini
    model: gemini-2.5-pro
    output_format: plain
    extra_args: []
    use_system_prompt_flag: false

gemini-3.1-pro-preview:
  mode: api_only
  tokenizer: chars
  context_window: 1000000
  api:
    kind: openai_compat
    key_env: GEMINI_API_KEY_PAID
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-3.1-pro-preview

# ── Ollama（本地）─────────────────────────────────────────
# 默认监听 http://localhost:11434/v1，OpenAI 兼容
ollama-llama3:
  mode: api_only
  tokenizer: cl100k_base   # LLaMA 系列用 cl100k_base 近似
  context_window: 8192     # 默认 llama3 8K；如本地跑 llama3-128k 等扩展版需手工覆盖
  api:
    kind: openai_compat
    key_env: OLLAMA_API_KEY      # ollama 无需 key，但 SDK 要求传一个非空字符串
    base_url: http://localhost:11434/v1
    model: llama3
