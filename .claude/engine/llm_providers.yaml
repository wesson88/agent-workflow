# engine/llm_providers.yaml
#
# 各 LLM provider 的 API + CLI 双轨配置，由 engine/llm.py 加载。
# Key（如 `claude-sonnet-4-6`）= 角色 frontmatter 中的 `model:` 字段值。
#
# Schema：
#   mode:    dual_track / api_only / cli_only
#   prefer:  auto / api / cli  （仅 dual_track 有效；auto = api 优先，回退 cli）
#   tokenizer: cl100k_base / o200k_base / chars
#              由 engine/token_counter.py 使用，决定 tiktoken 分词器。
#              cl100k_base  — Claude / DeepSeek / LLaMA 等
#              o200k_base   — GPT-4o / GPT-4o-mini
#              chars        — 无公开分词器，用 chars // 2.5 估算（Gemini 等）
#   context_window: 模型上下文窗口 token 数（input+output 上限）。
#              由 engine/llm.py 的 _audit_token_budget 使用，做入口总量审计：
#              ≥ 80% 打 WARNING，≥ 95% raise RuntimeError 提前阻断。
#              未声明时默认 200000（保守值）。
#   api:
#     kind:     anthropic / openai_compat
#     key_env:  存放 API key 的环境变量名
#     model:    传给 API 的实际 model id
#     base_url: 可选；OpenAI 兼容 SDK 用此重定向到 DeepSeek/Ollama 等
#   cli:
#     path:                          CLI 可执行文件名（PATH 中查找）
#     model:                         传给 CLI 的 --model 参数值
#     output_format:                 stream-json / plain
#     extra_args:                    其他必传 flag
#     use_system_prompt_flag:        true → 用 --system-prompt 替换默认；
#                                    false → 把 system prompt inline 进 user input
#                                    （inline 易被识别为 prompt injection，避免）

# ── Claude（默认）─────────────────────────────────────────
claude-sonnet-4-6:
  mode: dual_track
  prefer: auto
  tokenizer: cl100k_base
  context_window: 200000
  api:
    kind: anthropic
    key_env: ANTHROPIC_API_KEY
    model: claude-sonnet-4-6
  cli:
    path: claude
    model: claude-sonnet-4-6
    output_format: stream-json
    extra_args: ["--print", "--verbose", "--output-format", "stream-json"]
    use_system_prompt_flag: true

claude-opus-4-7:
  mode: dual_track
  prefer: auto
  tokenizer: cl100k_base
  context_window: 1000000  # Opus 4.7 默认走 1M extended context
  api:
    kind: anthropic
    key_env: ANTHROPIC_API_KEY
    model: claude-opus-4-7
  cli:
    path: claude
    model: claude-opus-4-7
    output_format: stream-json
    extra_args: ["--print", "--verbose", "--output-format", "stream-json"]
    use_system_prompt_flag: true

claude-haiku-4-5:
  mode: dual_track
  prefer: auto
  tokenizer: cl100k_base
  context_window: 200000
  api:
    kind: anthropic
    key_env: ANTHROPIC_API_KEY
    model: claude-haiku-4-5
  cli:
    path: claude
    model: claude-haiku-4-5
    output_format: stream-json
    extra_args: ["--print", "--verbose", "--output-format", "stream-json"]
    use_system_prompt_flag: true

# ── DeepSeek（OpenAI 兼容）────────────────────────────────
# 启用前需在 .env 中设置 DEEPSEEK_API_KEY=sk-...
deepseek-v3:
  mode: api_only
  tokenizer: cl100k_base
  context_window: 128000
  api:
    kind: openai_compat
    key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    model: deepseek-chat

deepseek-reasoner:
  mode: api_only
  tokenizer: cl100k_base
  context_window: 128000
  api:
    kind: openai_compat
    key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    model: deepseek-reasoner

# ── OpenAI ────────────────────────────────────────────────
# 启用前需在 .env 中设置 OPENAI_API_KEY=sk-...
gpt-4o:
  mode: api_only
  tokenizer: o200k_base
  context_window: 128000
  api:
    kind: openai_compat
    key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    model: gpt-4o

gpt-4o-mini:
  mode: api_only
  tokenizer: o200k_base
  context_window: 128000
  api:
    kind: openai_compat
    key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini

# ── Gemini ────────────────────────────────────────────────
# Gemini 使用 SentencePiece 分词器，tiktoken 不支持。
# tokenizer: chars → 由 token_counter.py 用 chars // 2.5 估算。
# API 路由：Gemini 官方提供 OpenAI 兼容端点（需 GEMINI_API_KEY）。
# CLI 路由：Google Gemini CLI（gemini），无 --system-prompt flag。
#
# 精度说明：chars 估算对 Gemini 误差约 ±20%（英文偏低，中文偏高）。
# 如需精确计数，安装 google-generativeai 并调用 model.count_tokens()。

gemini-2.0-pro:
  mode: dual_track
  prefer: auto
  tokenizer: chars
  context_window: 2000000
  api:
    kind: openai_compat
    key_env: GEMINI_API_KEY
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-2.0-pro
  cli:
    path: gemini
    model: gemini-2.0-pro
    output_format: plain
    extra_args: []
    use_system_prompt_flag: false

gemini-2.0-flash:
  mode: dual_track
  prefer: auto
  tokenizer: chars
  context_window: 1000000
  api:
    kind: openai_compat
    key_env: GEMINI_API_KEY
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-2.0-flash
  cli:
    path: gemini
    model: gemini-2.0-flash
    output_format: plain
    extra_args: []
    use_system_prompt_flag: false

gemini-2.5-pro:
  mode: dual_track
  prefer: auto
  tokenizer: chars
  context_window: 1000000
  api:
    kind: openai_compat
    key_env: GEMINI_API_KEY
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-2.5-pro-preview-05-06
  cli:
    path: gemini
    model: gemini-2.5-pro
    output_format: plain
    extra_args: []
    use_system_prompt_flag: false

gemini-2.5-flash:
  mode: dual_track
  prefer: auto
  tokenizer: chars
  context_window: 1000000
  api:
    kind: openai_compat
    key_env: GEMINI_API_KEY
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-2.5-flash-preview-04-17
  cli:
    path: gemini
    model: gemini-2.5-flash
    output_format: plain
    extra_args: []
    use_system_prompt_flag: false

# 保留旧 key 向后兼容
gemini-pro:
  mode: cli_only
  tokenizer: chars
  context_window: 32000
  cli:
    path: gemini
    model: gemini-2.0-pro
    output_format: plain
    extra_args: []
    use_system_prompt_flag: false

# ── Ollama（本地）─────────────────────────────────────────
# 默认监听 http://localhost:11434/v1，OpenAI 兼容
ollama-llama3:
  mode: api_only
  tokenizer: cl100k_base   # LLaMA 系列用 cl100k_base 近似
  context_window: 8192     # 默认 llama3 8K；如本地跑 llama3-128k 等扩展版需手工覆盖
  api:
    kind: openai_compat
    key_env: OLLAMA_API_KEY      # ollama 无需 key，但 SDK 要求传一个非空字符串
    base_url: http://localhost:11434/v1
    model: llama3
